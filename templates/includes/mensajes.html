{% if messages %}
<div class="contenedor mt-6 space-y-3">
  {% for message in messages %}
  <div data-mensaje role="status"
       class="flex items-start justify-between gap-4 rounded-xl px-4 py-3 text-sm shadow-sm ring-1
              {% if message.tags == 'error' %}bg-red-50 text-red-800 ring-red-200
              {% elif message.tags == 'warning' %}bg-amber-50 text-amber-800 ring-amber-200
              {% elif message.tags == 'success' %}bg-emerald-50 text-emerald-800 ring-emerald-200
              {% else %}bg-white text-stone-700 ring-stone-200{% endif %}">
    <p>{{ message }}</p>
    <button type="button" data-cerrar-mensaje class="text-lg leading-none opacity-60 hover:opacity-100" aria-label="Cerrar">&times;</button>
  </div>
  {% endfor %}
</div>
{% endif %}
