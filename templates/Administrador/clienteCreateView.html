{% extends 'Administrador/AdministradorBase.html' %}
{% block titulo %}Ferretería Maxi | Nuevo cliente{% endblock titulo %}
{% block contenido %}

<div class="mx-auto max-w-2xl">
  <h1 class="titulo-pagina">Nuevo cliente</h1>
  <form method="post" class="tarjeta mt-6 p-6 sm:p-8">
    {% csrf_token %}
    {% include 'includes/formulario.html' with form=form %}
    <div class="mt-8 flex justify-end gap-3 border-t border-stone-100 pt-6">
      <a href="{% url 'abm' %}" class="btn btn-secundario">Cancelar</a>
      <button type="submit" class="btn btn-oscuro">Crear cliente</button>
    </div>
  </form>
</div>

{% endblock contenido %}
