{% extends 'Administrador/AdministradorBase.html' %}
{% block titulo %}Ferretería Maxi | Crear cliente{% endblock titulo %}
{% block contenido %}

<h1 class="AdministradorCreateTitle">Crear cliente</h1>
<div class="row justify-content-center">
  <form method="post" class="col-md-6">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="text-center">
      <button type="submit" class="btn btn-primary m-4">Añadir</button>
      <a href="{% url 'abm' %}" class="btn btn-danger m-4">Cancelar</a>
    </div>
  </form>
</div>

{% endblock contenido %}
