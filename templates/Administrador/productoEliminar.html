{% extends 'Administrador/AdministradorBase.html' %}
{% block titulo %}Ferretería Maxi | Eliminar producto{% endblock titulo %}
{% block contenido %}

<h1 class="text-center">Eliminar producto</h1>
<div class="text-center my-5">
  <form method="post">
    {% csrf_token %}
    <p>¿Seguro que querés eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
    <button type="submit" class="btn btn-danger m-2">Confirmar</button>
    <a href="{% url 'abm' %}" class="btn btn-secondary m-2">Cancelar</a>
  </form>
</div>

{% endblock contenido %}
