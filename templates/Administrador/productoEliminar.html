{% extends 'Administrador/AdministradorBase.html' %}
{% block titulo %}Ferretería Maxi | Eliminar producto{% endblock titulo %}
{% block contenido %}

<div class="tarjeta mx-auto mt-6 max-w-lg p-8 text-center">
  <div class="mx-auto grid size-12 place-items-center rounded-full bg-red-100 text-2xl text-red-600" aria-hidden="true">!</div>
  <h1 class="mt-4 text-xl font-semibold">Eliminar producto</h1>
  <p class="mt-2 text-sm text-stone-600">¿Seguro que querés eliminar <strong class="text-stone-900">{{ object }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post" class="mt-8 flex justify-center gap-3">
    {% csrf_token %}
    <a href="{% url 'abm' %}" class="btn btn-secundario">Cancelar</a>
    <button type="submit" class="btn btn-peligro">Sí, eliminar</button>
  </form>
</div>

{% endblock contenido %}
