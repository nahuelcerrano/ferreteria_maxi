{% extends 'Portal/base.html' %}
{% load static %}
{% block titulo %}Ferretería Maxi | Contacto{% endblock titulo %}
{% block contenido %}

<section
  class="img-fluid pt-5"
  style="
    background-image: linear-gradient(to bottom, rgba(0, 0, 0, .10) 15%, rgba(0, 0, 0, 0.10) 25%), url('{% static 'img/background_page.jpg' %}');
    min-height: 100vh;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    position: relative;
  ">
  <div class="contenedorContacto form-container">
    <form class="col-6 text-center needs-validation text-black" id="formulario_contacto" action="{% url 'contacto' %}" method="post" novalidate>
      {% csrf_token %}
      {{ formulario_contacto }}
      <button class="btn btn-primary m-4" type="submit">Enviar consulta</button>
    </form>
  </div>
</section>

{% endblock contenido %}

{% block javascript %}
<script src="{% static 'js/scriptForm.js' %}"></script>
{% endblock javascript %}
